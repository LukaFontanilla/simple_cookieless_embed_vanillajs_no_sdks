<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Looker Embed Dashboard</title>
   <style>
       body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
       .container { max-width: 1000px; width: 100%; text-align: center; }
       #dashboard-iframe { width: 100%; height: 80vh; border: 1px solid #ccc; margin-top: 20px; }
       #fetch-button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
   </style>
</head>
<body>
   <div class="container">
       <h1>Looker Dashboard Embed</h1>
       <iframe id="dashboard-iframe" title="Looker Dashboard" style="display: none;"></iframe>
   </div>


   <script>
       // These values are replaced by the backend server when the page is rendered.
       const lookerBaseUrl = '{{LOOKER_BASE_URL}}';
       const dashboardId = '{{DASHBOARD_ID}}';
       const iframe = document.getElementById('dashboard-iframe');

       /**
        * This function is called when the Looker iframe requests a token refresh.
        * It sends a request to our backend to get new tokens and then posts them
        * back to the iframe.
        * @param {MessageEventSource} source The window that sent the message.
        * @param {string} origin The origin of the window that sent the message.
        */
       const generateEmbedTokens = async (source, origin) => {
         // Call the backend endpoint to generate a new set of tokens.
         const response = await fetch("/api/generate-embed-tokens", {
           method: "POST",
         });
         const data = await response.json();

         // Send the new tokens back to the Looker iframe.
         // The iframe is listening for the 'session:tokens' message type.
         source.postMessage(
           JSON.stringify({
             type: "session:tokens",
             ...data,
           }),
           origin
         );
       };

       /**
        * This function is called on page load to start the cookieless embed process.
        * It acquires the initial set of tokens and constructs the special embed URL.
        */
       const acquireEmbedTokens = async () => {
         // Call the backend to acquire a new cookieless session and get the initial tokens.
         const response = await fetch("/api/acquire-embed-session", {
           method: "POST",
         });
         const data = await response.json();

         // The path to the Looker content you want to embed.
         const path = `/embed/dashboards/${dashboardId}`;

         // Construct the query parameters for the embed URL.
         // The navigation_token is used by Looker to allow the user to navigate
         // within the embedded content.
         const query_params = {
           embed_domain: location.origin, // The domain of this page, for security you will need to add this to the Looker Embed Domain allowlist for cookieless to work.
           embed_navigation_token: data.navigation_token,
         };

         // The path and query parameters must be URI encoded to be part of the final URL.
         const encoded_path = encodeURIComponent(
           path +
             "?" +
             Object.entries(query_params)
               .map(([key, value]) => `${key}=${value}`)
               .join("&")
         );

         // Construct the final URL for the iframe.
         // The key part of the cookieless embed URL is '/login/embed/'.
         // This tells Looker to start an authentication flow for the embed user.
         const iframe_url = new URL(
           `${lookerBaseUrl}/login/embed/${encoded_path}`
         );

         // The authentication_token is a one-time use token that authenticates the embed user.
         // It is passed as a query parameter to the /login/embed/ URL.
         iframe_url.searchParams.set(
           "embed_authentication_token",
           data.authentication_token
         );

         // Set the iframe source to the constructed URL to load the Looker content.
         iframe.src = iframe_url.toString();
         iframe.style.display = 'block';
       };

      /**
       * This event listener listens for messages from the Looker iframe.
       * This is the core of the cookieless token refresh mechanism.
       */
      window.addEventListener("message", (event) => {
        let data = {};
        try {
          data = JSON.parse(event.data);
        } catch (e) {
          // Not a JSON message, ignore.
        }

        // When the Looker iframe needs new tokens, it will send a 'session:tokens:request' message.
        if (data.type === "session:tokens:request") {
          // Call our function to get new tokens and send them back to the iframe.
          generateEmbedTokens(event.source, event.origin);
        }
      });

       // Start the process when the page loads.
       acquireEmbedTokens();
   </script>
</body>
</html>
