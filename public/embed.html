<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Looker Embed Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@looker/embed-sdk@2.0.6/dist/main.min.js"></script>
</head>

<body>
  <div id="app-container">
    <div id="banner">
      <div id="banner-content">
        <h1>Looker Embed</h1>
        <p>Welcome! This is an <i>ultra</i> minimal example of a <strong style="color: purple;">Looker</strong>
          cookieless embed session. <br />
          This example <strong>doesn't</strong> use any Frontend or Backend SDK of <strong
            style="color: purple;">Looker</strong> and is implemented in <span
            style="text-decoration:2px green underline;">VanillaJS</span>.
        </p>
      </div>
      <button id="collapse-button">&laquo;</button>
    </div>
    <div id="content-container">
      <img id="looker-loader" src="looker.svg" />
      <div id="iframe-container">
      </div>
    </div>
  </div>

  <script>
    // --- Looker Embed Configuration ---
    const lookerBaseUrl = '{{LOOKER_BASE_URL}}';
        const dashboardId = '{{DASHBOARD_ID}}';

    // --- Looker Loader ---
    const lookerLoader = document.getElementById('looker-loader');
    const iframeContainer = document.getElementById('iframe-container');

    // --- Collapse/Expand Banner Logic ---
    const banner = document.getElementById('banner');
    const collapseButton = document.getElementById('collapse-button');

    collapseButton.addEventListener('click', () => {
      banner.classList.toggle('collapsed');
      if (banner.classList.contains('collapsed')) {
        collapseButton.innerHTML = '&raquo;';
      } else {
        collapseButton.innerHTML = '&laquo;';
      }
    });

        // --- Looker Embed SDK ---

        // Initialize the Looker Embed SDK for Cookieless
        // Note: We strip the protocol from lookerBaseUrl if present
        const lookerHost = lookerBaseUrl.replace(/^https?:\/\//, '');

        LookerEmbedSDK.getEmbedSDK().initCookieless(
          lookerHost,
          '/api/acquire-embed-session',
          '/api/generate-embed-tokens'
      );

              let isReloading = false;

        const setupDashboard = async () => {
          try {
            const createDashboard = async (containerSelector, dId) => {
              return LookerEmbedSDK.getEmbedSDK().createDashboardWithId(dId)
                .appendTo(containerSelector)
                .on('dashboard:run:complete', () => {
          // Note: This will fire for each dashboard. 
                  lookerLoader.classList.add('hide');
                  iframeContainer.classList.add('loaded');
                })
                // Remount the iframes automatically if the cookieless session drops
                .on('session:status', (event) => {
                  if (event && event.expired) {
                    remountDashboards();
                  }
                })
                .build()
                .connect();
            };

            // Create two dashboards
            await Promise.all([
              createDashboard('#iframe-container', dashboardId),
              createDashboard('#iframe-container', dashboardId)
            ]);
          } catch (error) {
            console.error('An unexpected error occurred during dashboard setup', error);
            isReloading = false;
          }
        };

              const remountDashboards = async () => {
                if (isReloading) return;
                isReloading = true;
                console.log("Looker Session Expired. Remounting iframes...");

                // Clear the old IFRAME DOM and reset loaders
                iframeContainer.innerHTML = '';
                lookerLoader.classList.remove('hide');
                iframeContainer.classList.remove('loaded');

                // The Looker Embed SDK maintains an internal state machine singleton.
                // If we do not explicitly wipe it, the 'sessionCreated' flag will stay true
                // and break Looker's internal deduplication loop, causing race conditions in /acquire.
                LookerEmbedSDK.getEmbedSDK().clearSession();

                LookerEmbedSDK.getEmbedSDK().initCookieless(
                  lookerHost,
                  '/api/acquire-embed-session',
                  '/api/generate-embed-tokens'
                );

                await setupDashboard();
                isReloading = false;
              };

    // Start the process when the page loads.
        setupDashboard();
  </script>
</body>

</html>
